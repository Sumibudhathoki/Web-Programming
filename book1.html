<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>It starts with us- Book Nest</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <style>
    
     {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 20px;
      margin-top: 30px;
    }
    img {
      width: 100%;
      height: 200px;
      object-fit: cover;
      border-radius: 12px;
      transition: transform 0.3s, box-shadow 0.3s;
    }
    . img:hover {
      transform: scale(1.05);
      box-shadow: 0 12px 25px rgba(0,0,0,0.15);
    }

    @media(max-width:768px){
       {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>

<!-- Navbar -->
<nav class="navbar navbar-expand-lg navbar-dark" style="background: linear-gradient(90deg,#163029,#1F3D36);">
  <div class="container">
    <a class="navbar-brand" href="index.html">Book Nest </a>
  </div>
</nav>


<section class="gallery-page py-5" style="background: linear-gradient(90deg,#F5F2EC,#E8E1D8);">
  <div class="container">
    <h1 class="mb-3" style="color:#163029;"></h1>
    <p style="color:#2E2E2E; font-size:1.1rem;">
      Our office designs prioritize productivity and comfort, integrating modern furniture, organized layouts, and stylish accents to create professional and welcoming environments.
    </p>
    
   
  

    <div class="text-center mt-5">
      <a href="index.html#gallery" class="btn btn-secondary">Back to Gallery</a>
    </div>
  </div>
</section>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
